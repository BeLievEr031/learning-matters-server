name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Build & push container image to registry
      - name: Build and push container image
        run: |
          echo "Building container image for release: ${{ github.sha }}"
          # docker build -t registry.example.com/learning-matters:${{ github.sha }} .
          # docker push registry.example.com/learning-matters:${{ github.sha }}

      # Step 2: Run forward-compatible database migrations
      - name: Run database migrations
        run: |
          echo "Running database schema migrations against ${{ inputs.environment }} database..."
          # docker run --rm -e DATABASE_URL=${{ secrets.DATABASE_URL }} registry.example.com/learning-matters:${{ github.sha }} npm run db:migrate

      # Step 3: Rolling deployment of new container service
      - name: Deploy updated service
        run: |
          echo "Rolling out release ${{ github.sha }} to ${{ inputs.environment }}..."
          # kubectl set image deployment/learning-matters api=registry.example.com/learning-matters:${{ github.sha }}
          # kubectl rollout status deployment/learning-matters --timeout=120s

      # Step 4: Smoke test readiness probe
      - name: Smoke test readiness endpoint
        run: |
          echo "Verifying readiness probe on deployed instance..."
          # curl --fail --retry 5 --retry-delay 5 https://${{ inputs.environment }}.api.learning-matters.com/ready || exit 1

      # Step 5: Rollback trigger on deployment or smoke test failure
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Smoke test or rollout failed! Triggering automatic rollback to previous release..."
          # kubectl rollout undo deployment/learning-matters
